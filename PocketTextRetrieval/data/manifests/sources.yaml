project: PocketTextRetrieval
created: 2026-08-20
purpose: pocket-level text-to-pocket and pocket-to-text retrieval

sources:
  biolip:
    role: primary_structure_and_annotation_source
    paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC10767969/
    download_page: https://seq2fun.dcmb.med.umich.edu/BioLiP/download.html
    status: annotation_downloaded_structure_batch_collecting
    notes: experimental biologically relevant protein-ligand interactions; use small-molecule subset first

  oneprot:
    role: compatibility_validation_and_test_source
    paper: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1013679
    zenodo: https://zenodo.org/records/15429594
    status: metadata_downloaded
    files:
      - test_all.csv
      - test_text.csv
      - test_pocket.csv
      - val_text.csv
      - val_pocket.csv
      - pockets_100_residues.h5
    notes: original text is protein-level UniProt text; use test_all for original paired compatibility evaluation and derive a separate pocket-text subset

  receptor_ai_literature_pockets:
    role: gold_pocket_text_reference
    repository: https://github.com/receptor-ai/LLM-benchmark-dataset
    paper: https://pmc.ncbi.nlm.nih.gov/articles/PMC12371332/
    status: downloaded

  uniprot:
    role: pocket_text_annotation_source
    sequence_annotations: https://www.uniprot.org/help/sequence_annotation
    api: https://rest.uniprot.org/
    status: deferred_until_mapping

  rcsb:
    role: pdb_metadata_and_positional_annotation_source
    api: https://data.rcsb.org/
    status: fallback_structure_source

  plinder:
    role: optional_structure_pretraining_source
    repository: https://github.com/plinder-org/plinder
    status: deferred

  unisite:
    role: optional_multi_pocket_and_hard_negative_source
    paper: https://arxiv.org/abs/2506.03237
    repository: https://github.com/quanlin-wu/unisite
    status: deferred
